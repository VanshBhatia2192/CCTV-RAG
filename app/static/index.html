<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV search</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#667085; --line:#e3e6ea; --accent:#2457d6; --chip:#eef1f6; --warn:#8a5a00; --warnbg:#fff6e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2227; --ink:#e8ebef; --mute:#97a0ab; --line:#2e353c; --accent:#7ea2ff; --chip:#272e35; --warn:#f0c674; --warnbg:#2f2a1a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px 10px; max-width:1200px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 12px; font-weight:650; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; }
  button.go, button.sm { border:0; background:var(--accent); color:#fff; padding:10px 18px; border-radius:8px; cursor:pointer; font:inherit; }
  button.sm { padding:5px 10px; font-size:13px; }
  button.ghost { background:var(--chip); color:var(--ink); }
  .examples { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; color:var(--mute); font-size:13px; align-items:center; }
  .examples a { background:var(--chip); padding:3px 9px; border-radius:99px; cursor:pointer; color:var(--ink); }
  main { max-width:1200px; margin:0 auto; padding:6px 24px 40px; }
  #status { color:var(--mute); margin:10px 0; min-height:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .grid.wide { grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card img, .card video { width:100%; height:210px; object-fit:contain; background:#0d0f12; display:block; }
  .card video { height:190px; }
  .body { padding:9px 11px 11px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .meta { color:var(--mute); font-size:12.5px; }
  .cap { font-size:13.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { background:var(--chip); border-radius:99px; padding:1px 8px; font-size:12px; }
  .row { display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); padding:0; width:min(1100px,94vw); max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .dhead { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  .dbody { padding:14px 16px 18px; overflow:auto; max-height:calc(92vh - 70px); }
  .opts { display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .note { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:8px 11px; margin:10px 0; font-size:13.5px; }
  .qrow { display:flex; gap:12px; align-items:center; margin:10px 0 14px; }
  .qrow img { height:120px; border-radius:8px; background:#0d0f12; }
  video.big { width:100%; max-height:70vh; background:#000; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>CCTV search</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-kind="ask" aria-selected="true">Ask</button>
    <button class="tab" role="tab" data-kind="person" aria-selected="false">People</button>
    <button class="tab" role="tab" data-kind="vehicle" aria-selected="false">Vehicles</button>
    <button class="tab" role="tab" data-kind="incident" aria-selected="false">Incidents</button>
  </div>
  <form id="f"><input type="text" id="q" placeholder="Describe what you are looking for" autocomplete="off" autofocus><button class="go">Search</button></form>
  <div class="examples" id="ex"></div>
  <div class="examples" id="opts"><label><input type="checkbox" id="llm"> LLM query parser</label><label><input type="checkbox" id="rr"> Re-rank (slower)</label><span>Ask finds the type and camera from your sentence, then returns short clips.</span></div>
</header>
<main><div id="status"></div><div id="grid" class="grid"></div></main>

<dialog id="vid"><div class="dhead"><strong id="vtitle">Clip</strong><button class="sm ghost" onclick="vid.close()">Close</button></div><div class="dbody"><video id="vplayer" class="big" controls></video></div></dialog>

<dialog id="reid">
  <div class="dhead">
    <strong>Same person on other cameras</strong>
    <div class="opts">
      <label><input type="radio" name="rmode" value="any" checked> Any appearance (fused)</label>
      <label><input type="radio" name="rmode" value="cloth_change"> Clothing changed (gait only)</label>
      <label><input type="checkbox" id="fb" checked> Full-body tracks only</label>
    </div>
    <button class="sm ghost" onclick="reid.close()">Close</button>
  </div>
  <div class="dbody"><div id="rstatus" class="meta"></div><div id="rnote"></div><div id="rq" class="qrow"></div><div id="rgrid" class="grid"></div>
    <p class="meta">Results are ranked by visual and gait similarity. They are candidates, not verified identities; gait is only used for people who are walking.</p></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids.filter(k => k != null)); return e; };
const EXAMPLES = {
  ask: ["a man in a red shirt walking", "white SUV parked near the entrance", "people gathering in a group", "someone running on camera bus.G507"],
  person: ["a man in a red shirt walking", "woman with a backpack", "person wearing a hat carrying a bag", "someone running"],
  vehicle: ["a white SUV parked", "red pickup truck", "black sedan driving", "bus turning left"],
  incident: ["people gathering in a group", "someone loading a vehicle", "a person entering a building", "two people talking"]
};
let kind = "ask", currentReid = null;
const vid = $("#vid"), reid = $("#reid");

function setKind(k) {
  kind = k;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.kind === k));
  $("#ex").replaceChildren(el("span", {textContent: "Try:"}), ...EXAMPLES[k].map(t => el("a", {textContent: t, onclick: () => { $("#q").value = t; run(); }})));
  $("#grid").replaceChildren(); $("#status").textContent = "";
  $("#opts").style.display = k === "ask" ? "flex" : "none";
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setKind(t.dataset.kind));
$("#f").onsubmit = e => { e.preventDefault(); run(); };

function fmt(s) { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function play(c) {
  $("#vtitle").textContent = `${c.camera}  ${fmt(c.start_s)}–${fmt(c.end_s)}`;
  const p = $("#vplayer"); p.src = `${c.clip}#t=${c.clip_t0},${c.clip_t1}`; vid.showModal(); p.play().catch(() => {});
}
vid.addEventListener("close", () => $("#vplayer").pause());

function attrChips(a) {
  if (!a) return [];
  const x = [];
  if (a.upper_color || a.upper_type) x.push(`top: ${[a.upper_color, a.upper_type].filter(Boolean).join(" ")}`);
  if (a.lower_color) x.push(`bottom: ${a.lower_color}`);
  if (a.bag && a.bag !== "none") x.push(`bag: ${a.bag}`);
  if (a.hat && a.hat !== "none") x.push(a.hat === "hat" ? "hat" : `hat: ${a.hat}`);
  if (a.motion) x.push(a.motion);
  if (a.color || a.type) x.push([a.color, a.type].filter(Boolean).join(" "));
  if (a.turn && a.turn !== "none" && a.turn !== "straight") x.push(`turning ${a.turn}`);
  return x.map(s => el("span", {className: "chip", textContent: s}));
}
function card(c, opts = {}) {
  const media = c.kind === "incident"
    ? el("video", {src: `${c.clip}#t=${c.clip_t0},${c.clip_t1}`, controls: true, preload: "metadata", muted: true})
    : el("img", {src: c.thumb, loading: "lazy", alt: c.caption || "track", onclick: () => play(c), style: "cursor:pointer"});
  const row = el("div", {className: "row"});
  if (c.kind !== "incident") row.append(el("button", {className: "sm ghost", textContent: "Play clip", onclick: () => play(c)}));
  if (c.kind === "person") row.append(el("button", {className: "sm", textContent: "Find on other cameras", onclick: () => openReid(c)}));
  const extra = [];
  if (opts.reid) extra.push(el("div", {className: "meta", textContent: `score ${c.score}  ·  appearance ${c.appearance_z ?? "–"}  ·  gait ${c.gait_z ?? "–"}`}));
  else if (c.score != null) extra.push(el("div", {className: "meta", textContent: `score ${c.score}`}));
  return el("div", {className: "card"}, media, el("div", {className: "body"},
    el("div", {className: "meta", textContent: `${c.camera}  ·  ${fmt(c.start_s)}–${fmt(c.end_s)}  ·  #${c.id}`}),
    c.caption ? el("div", {className: "cap", textContent: c.caption}) : null,
    el("div", {className: "chips"}, ...attrChips(c.attrs)), ...extra, row));
}

async function run() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#status").textContent = "Searching…"; $("#grid").replaceChildren();
  try {
    if (kind === "ask") return await runAsk(q);
    const r = await fetch(`/api/search?kind=${kind}&q=${encodeURIComponent(q)}&k=24`);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    $("#status").textContent = `${d.n} results in ${d.took_s}s  (${d.mode})`;
    $("#grid").className = kind === "incident" ? "grid wide" : "grid";
    $("#grid").replaceChildren(...d.results.map(c => card(c)));
  } catch (e) { $("#status").textContent = "Search failed: " + e.message; }
}

function askCard(c) {
  const row = el("div", {className: "row"});
  if (c.kind === "person" && c.id != null && c.thumb) row.append(el("button", {className: "sm", textContent: "Find on other cameras", onclick: () => openReid(c)}));
  return el("div", {className: "card"},
    el("video", Object.assign({src: c.clip + "#t=0.1", controls: true, preload: "metadata", muted: true}, c.thumb ? {poster: c.thumb} : {})),
    el("div", {className: "body"},
      el("div", {className: "meta", textContent: `${c.camera}  ·  ${fmt(c.start_s)}–${fmt(c.end_s)}  ·  score ${c.score}`}),
      c.caption ? el("div", {className: "cap", textContent: c.caption}) : null,
      c.vlm ? el("div", {className: "meta", textContent: String(c.vlm)}) : null,
      el("div", {className: "chips"}, ...attrChips(c.attrs)), row));
}
async function runAsk(q) {
  const r = await fetch(`/api/ask?q=${encodeURIComponent(q)}&n=12&use_llm=${$("#llm").checked}&rerank=${$("#rr").checked}`);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  const d = await r.json();
  const p = d.query || {};
  $("#status").textContent = `${d.n} clips in ${d.latency_s}s · read as: ${p.type || d.kind}${p.camera ? " · camera " + p.camera : ""} · "${p.text || q}"`;
  $("#grid").className = "grid wide";
  $("#grid").replaceChildren(...d.results.map(askCard));
}

async function openReid(c) { currentReid = c; reid.showModal(); await loadReid(); }
document.querySelectorAll("input[name=rmode]").forEach(r => r.onchange = loadReid); $("#fb").onchange = loadReid;
async function loadReid() {
  const c = currentReid; if (!c) return;
  const mode = document.querySelector("input[name=rmode]:checked").value;
  $("#rstatus").textContent = "Searching other cameras…"; $("#rgrid").replaceChildren(); $("#rnote").replaceChildren();
  try {
    const r = await fetch(`/api/reid/${c.id}?mode=${mode}&k=12&full_body=${$("#fb").checked}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    $("#rq").replaceChildren(el("img", {src: c.thumb}), el("div", {}, el("div", {textContent: `Query track #${c.id}`}), el("div", {className: "meta", textContent: `${c.camera}  ·  ${fmt(c.start_s)}  ·  appearance weight ${d.w_appearance}`})));
    if (d.note) $("#rnote").append(el("div", {className: "note", textContent: d.note}));
    $("#rstatus").textContent = d.results.length ? `${d.results.length} candidates from other cameras` : "No candidates found.";
    $("#rgrid").replaceChildren(...d.results.map(x => card(x, {reid: true})));
  } catch (e) { $("#rstatus").textContent = "Failed: " + e.message; }
}
setKind("ask");
(async function pollWarm() {
  try {
    const h = await (await fetch("/api/health")).json();
    if (!h.done) { if (!$("#status").textContent) $("#status").textContent = "Loading search models (first start only, this can take a minute)…"; setTimeout(pollWarm, 2000); }
    else if (h.error) $("#status").textContent = "Models loaded with a warning: " + h.error;
    else if ($("#status").textContent.startsWith("Loading search models")) $("#status").textContent = `Ready (models loaded in ${h.secs}s).`;
  } catch (e) { setTimeout(pollWarm, 3000); }
})();
</script>
</body>
</html>
